# nginx-Konfiguration des Web-Containers (Produktion).
# Aufgaben: SPA-Auslieferung + internes Routing zu API und Voice-SFU.
# TLS terminiert NICHT hier, sondern im Reverse Proxy davor (Host-nginx/Caddy) –
# dieser Container lauscht nur auf dem internen Docker-Netz bzw. 127.0.0.1.

# WebSocket-Upgrade nur durchreichen, wenn der Client es anfordert.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Anhänge: max. 10 MiB Klartext + AEAD-Overhead (MAX_ATTACHMENT_CIPHERTEXT_BYTES).
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # REST-API (NestJS, globaler Prefix /api)
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Vom äußeren Reverse Proxy gesetzt (https); leer bei direktem Zugriff.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Echtzeit-Gateway (WebSocket, teilt sich den HTTP-Server mit der API)
  location = /gateway {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Lange offene Verbindungen nicht kappen (Gateway hat eigenen Heartbeat).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Voice-Signaling (WebSocket zum mediasoup-SFU; Medienströme laufen NICHT
  # hier durch, sondern direkt über die veröffentlichten UDP/TCP-RTC-Ports)
  location = /voice {
    proxy_pass http://voice:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA-Fallback: alle übrigen Pfade (z. B. /invite/CODE) auf index.html.
  location / {
    try_files $uri /index.html;
  }

  # index.html nie cachen, damit neue Deployments sofort greifen –
  # die gehashten Assets aus /assets dürfen dagegen lange gecacht werden.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
